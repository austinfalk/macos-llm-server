# Installed by scripts/4-harden.sh as /etc/ssh/sshd_config.d/200-llm-server.conf
# (LLM_SSH_TAILNET_ONLY=yes).

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no

# Refuse anything that does not arrive over the tailnet -- in practice, the
# local network -- before authentication. Tailscale assigns 100.64.0.0/10 and
# fd7a:115c:a1e0::/48; MagicDNS names resolve to both, so both must be allowed.
#
# This is per connection because macOS sshd is socket-activated by launchd and
# never binds a socket itself, so ListenAddress has no effect.
#
# The leading `*` is required. A Match list made only of negations never
# matches anything -- negations can only exclude from a positive match -- so
# without it this block silently does nothing.
Match Address *,!100.64.0.0/10,!fd7a:115c:a1e0::/48,!127.0.0.1,!::1
    DenyUsers *

# Closes the Match block. Required: this directory is included at the TOP of
# /etc/ssh/sshd_config, and a Match left open would swallow the rest of it.
Match all
