# Screen Sharing (VNC, port 5900) and the local Kerberos KDC its sign-in can use
# (port 88), from the tailnet only. Rendered by scripts/4-harden.sh into a pf
# anchor under com.apple/, which /etc/pf.conf already evaluates, so no system
# file is edited.
#
# Both listen on every network, and macOS has no setting to limit that. A
# spoofed tailnet source address from the local network cannot complete a
# connection: the replies go back into the tailnet.
pass in quick proto { tcp, udp } from { 100.64.0.0/10, fd7a:115c:a1e0::/48 } to any port { 88, 5900 }
block drop in quick proto { tcp, udp } to any port { 88, 5900 }
