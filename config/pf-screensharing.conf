# Screen Sharing (VNC, port 5900), the local Kerberos KDC (port 88) and
# Sunshine (docs/omarchy-desktop.md, step 2), from the tailnet only. Rendered by
# scripts/4-harden.sh into a pf anchor under com.apple/, which /etc/pf.conf
# already evaluates, so no system file is edited.
#
# macOS's Screen Sharing listens on every network and has no setting to limit
# that. Its sign-in between Macs can use the machine's own Kerberos KDC, which
# also listens everywhere; clients here (Remmina, Screens) do not need it from
# the local network. SSH is limited the same way, in sshd-tailnet-only.conf. A
# spoofed tailnet source address from the local network cannot complete a
# connection: the replies go back into the tailnet.
#
# Sunshine, if installed, also listens on every network: TCP 47984 (HTTPS),
# 47989 (HTTP), 47990 (web UI) and 48010 (RTSP); UDP 47998-48000 (video,
# control, audio). These are its defaults, from base port 47989. The rules
# cost nothing while it is not installed. pf filters loopback too, so the web
# UI, which answers only on the Mac itself (and through an SSH tunnel, which
# arrives from 127.0.0.1), needs loopback let through. A connection to the
# machine's own LAN address comes from that address, and is still dropped.
pass in quick proto { tcp, udp } from { 100.64.0.0/10, fd7a:115c:a1e0::/48 } to any port { 88, 5900 }
block drop in quick proto { tcp, udp } to any port 5900
block drop in quick proto { tcp, udp } to any port 88
pass in quick proto tcp from { 127.0.0.1, ::1 } to any port 47990
pass in quick proto tcp from { 100.64.0.0/10, fd7a:115c:a1e0::/48 } to any port { 47984, 47989, 47990, 48010 }
pass in quick proto udp from { 100.64.0.0/10, fd7a:115c:a1e0::/48 } to any port 47998:48000
block drop in quick proto tcp to any port { 47984, 47989, 47990, 48010 }
block drop in quick proto udp to any port 47998:48000
